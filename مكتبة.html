
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشغل القرآن الكريم</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Amiri', serif;
      background-color: #fdfdf5;
      margin: 0;
      padding: 30px 15px;
      text-align: center;
    }

    .container {
      background-color: #fdfdf5;
      max-width: 600px;
      margin: auto;
      padding: 30px;
      border-radius: 20px;
      
    }

    h1 {
      color: #0f5e41;
      font-size: 28px;
      margin-bottom: 25px;
    }

    label {
      font-size: 18px;
      color: #0f5e41;
      margin-top: 15px;
      display: block;
      font-weight: bold;
    }

    select {
      font-family: inherit;
      font-size: 16px;
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      margin: 12px 0;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      width: 80%;
    }

    select:focus {
      outline: none;
      box-shadow: 0 0 0 3px #0f5e41;
    }

    .audio-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
      gap: 15px;
      flex-wrap: wrap;
    }

    .audio-controls button {
      background-color: transparent;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: #0f5e41;
      transition: transform 0.2s;
    }

    .audio-controls button:hover {
      transform: scale(1.3);
      color: #0c4a33;
    }

    .custom-audio {
      width: 100%;
      margin-top: 10px;
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      background-color: #ddd;
      border-radius: 5px;
      margin-top: 10px;
      cursor: pointer;
      position: relative;
    }

    .progress {
      height: 100%;
      width: 0;
      background-color: #0f5e41;
      border-radius: 5px;
      position: absolute;
      top: 0;
      left: 0;
    }

    .error-message {
      color: red;
      font-size: 14px;
      margin-top: 10px;
    }

    .speed-indicator {
      font-size: 14px;
      color: #0f5e41;
      margin-top: 5px;
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>
  <a href="javascript:history.back()" style="position: absolute; top: 20px; left: 320px; font-size: 22px; color: #0f5e41; text-decoration: none;">
  <i class="fas fa-arrow-right"></i>
</a>

  <div class="container">
    <h1>مشغل القرآن الكريم</h1>

    <label for="qariSelect">اختر القارئ:</label>
    <select id="qariSelect"></select>

    <label for="suraSelect">اختر السورة:</label>
    <select id="suraSelect"></select>

    <button onclick="playSura()" style="
      font-size: 16px;
      padding: 10px 20px;
      background-color: #0f5e41;
      color: white;
      border: none;
      border-radius: 10px;
      margin-top: 10px;
      cursor: pointer;
    ">تشغيل السورة</button>

    <div class="audio-section">
      <div class="audio-controls">
        <button onclick="togglePlay()"><i id="playPauseIcon" class="fas fa-play"></i></button>
        <button onclick="decreaseSpeed()"><i class="fas fa-backward"></i></button>
        <button onclick="increaseSpeed()"><i class="fas fa-forward"></i></button>
        <button onclick="downloadCurrent()"><i class="fas fa-download"></i></button>
      </div>
      <div class="speed-indicator" id="speedDisplay">السرعة: 1x</div>
      <audio id="audioPlayer" class="custom-audio"></audio>
      <div class="progress-bar" onclick="seek(event)">
        <div id="progress" class="progress"></div>
      </div>
    </div>

    <div id="errorMessage" class="error-message"></div>

    
  </div>

  <script>
    const qariSelect = document.getElementById("qariSelect");
    const suraSelect = document.getElementById("suraSelect");
    const audioPlayer = document.getElementById("audioPlayer");
    const errorMessage = document.getElementById("errorMessage");
    const progress = document.getElementById("progress");
    const playPauseIcon = document.getElementById("playPauseIcon");
    const speedDisplay = document.getElementById("speedDisplay");

    let currentAudioUrl = '';
    let currentSpeed = 1;

    async function fetchQaris() {
      try {
        const response = await fetch("https://mp3quran.net/api/v3/reciters");
        const data = await response.json();
        data.reciters.forEach(qari => {
          const option = document.createElement("option");
          option.value = qari.id;
          option.textContent = qari.name;
          qariSelect.appendChild(option);
        });
      } catch (error) {
        errorMessage.textContent = "خطأ في جلب قائمة القراء";
      }
    }

    async function fetchSuras() {
      try {
        const response = await fetch("https://api.quran.com/api/v4/chapters");
        const data = await response.json();
        data.chapters.forEach(sura => {
          const option = document.createElement("option");
          option.value = sura.id;
          option.textContent = `${sura.id} - ${sura.name_arabic}`;
          suraSelect.appendChild(option);
        });
      } catch (error) {
        errorMessage.textContent = "خطأ في جلب قائمة السور";
      }
    }

    async function playSura() {
      const qariId = qariSelect.value;
      const suraId = suraSelect.value;
      if (!qariId || !suraId) {
        errorMessage.textContent = "الرجاء اختيار القارئ والسورة";
        return;
      }

      try {
        const response = await fetch(`https://mp3quran.net/api/v3/reciters?reciter=${qariId}`);
        const data = await response.json();
        const reciter = data.reciters.find(r => r.id == qariId);

        if (reciter && reciter.moshaf.length > 0) {
          const suraNumber = String(suraId).padStart(3, '0');
          const baseUrl = reciter.moshaf[0].server;
          currentAudioUrl = `${baseUrl}${suraNumber}.mp3`;

          audioPlayer.src = currentAudioUrl;
          audioPlayer.play();
          playPauseIcon.className = 'fas fa-pause';
        } else {
          errorMessage.textContent = "لا يوجد تسجيل متاح لهذه السورة.";
        }
      } catch (error) {
        errorMessage.textContent = "حدث خطأ أثناء التشغيل.";
      }
    }

    function togglePlay() {
      if (audioPlayer.paused) {
        audioPlayer.play();
        playPauseIcon.className = 'fas fa-pause';
      } else {
        audioPlayer.pause();
        playPauseIcon.className = 'fas fa-play';
      }
    }

    function increaseSpeed() {
      if (currentSpeed < 2) {
        currentSpeed += 0.25;
        audioPlayer.playbackRate = currentSpeed;
        updateSpeedDisplay();
      }
    }

    function decreaseSpeed() {
      if (currentSpeed > 0.5) {
        currentSpeed -= 0.25;
        audioPlayer.playbackRate = currentSpeed;
        updateSpeedDisplay();
      }
    }

    function updateSpeedDisplay() {
      speedDisplay.textContent = `السرعة: ${currentSpeed.toFixed(2)}x`;
    }

    function downloadCurrent() {
      if (currentAudioUrl) {
        const a = document.createElement('a');
        a.href = currentAudioUrl;
        a.download = "sura.mp3";
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
    }

    function seek(event) {
      const rect = event.currentTarget.getBoundingClientRect();
      const percent = (event.clientX - rect.left) / rect.width;
      audioPlayer.currentTime = percent * audioPlayer.duration;
    }

    audioPlayer.addEventListener('timeupdate', () => {
      const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
      progress.style.width = percent + '%';
    });

    function goBack() {
      window.location.href = "index.html";
    }

    fetchQaris();
    fetchSuras();
  </script>

</body>
</html>
