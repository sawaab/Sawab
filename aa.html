    .card {

    }
    .card .number {

      top: 10px;
      left: 10px;

      font-weight: bold;
    }
    .card .heart {

      transition: transform 0.3s ease;

    }

      animation: pulse 0.4s ease;

<div class="top-bar" style="justify-content: ;">
  <div style="margin-left: 10px;">
    <label for="readerSelect" style="font-size: 0px; margin-left: 0px;"></label>
   <div id="readerSelectWrapper" style="display: none;">

  <select id="readerSelect" class="reader-select"></select>
</div>
  </div>
  
  <button class="toggle-btn" id="toggleBtn">المفضلات</button>
</div>

<h2 id="main-title" style="
      text-align: center;
      font-size: 28px;
      color: #0f5e41;
      font-family: 'Amiri', serif;
      margin-bottom: 20px;
      
      padding: 10px;
      border-radius: 15px;
      
      display: inline-block;
      width: 100%;
    ">فهرس سور القرآن الكريم</h2>
  <div class="search-container">
  <input type="text" id="searchInput" placeholder="ابحث عن السورة..." oninput="filterCards()">
</div>

<div class="grid" id="suraContainer"></div>
<div id="ayahContainer"></div>
  
<button id="inAyahBackBtn" onclick="goBackToList()" style="display: none; position: fixed; top: 20px; left: 20px; z-index: 1000; background-color: #3b6f52; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px;">العودة</button>
<script>
  function removeTashkeel(text) {
    return text.replace(/[\u0610-\u061A\u064B-\u065F\u06D6-\u06ED]/g, "");
  }

  function filterCards() {
    const input = document.getElementById('searchInput');
    const filter = removeTashkeel(input.value.trim().toLowerCase());
    const cards = document.querySelectorAll('.card');

    cards.forEach(card => {
      const text = removeTashkeel(card.textContent.trim().toLowerCase());
      if (text.includes(filter)) {
        card.style.display = 'flex';
        card.style.animation = 'fadeIn 0.4s ease';
      } else {
        card.style.display = 'none';
      }
    });
  }
</script>
<script>
  
  const suraContainer = document.getElementById('suraContainer');
  const ayahContainer = document.getElementById('ayahContainer');
  const title = document.getElementById('main-title');
  const toggleBtn = document.getElementById('toggleBtn');
  const favKey = 'favSuras';
  let favList = JSON.parse(localStorage.getItem(favKey)) || [];
  let allSuras = [];
  let showingFavs = false;

  function getSelectedReader() {
    return document.getElementById("readerSelect").value;
  }

  function toggleFav(name, icon) {
    const index = favList.indexOf(name);
    if (index > -1) {
      favList.splice(index, 1);
      icon.classList.remove("favorited");
    } else {
      favList.push(name);
      icon.classList.add("favorited");
      icon.classList.add("animate");
      setTimeout(() => icon.classList.remove("animate"), 400);
    }
    localStorage.setItem(favKey, JSON.stringify(favList));
  }

  function renderSuras(suras) {
    suraContainer.innerHTML = '';
    suras.forEach(sura => {
      const card = document.createElement('div');
      card.className = 'card';

      const number = document.createElement('div');
      number.className = 'number';
      number.textContent = sura.number;

      const heart = document.createElement('i');
      heart.className = 'fas fa-heart heart';
      if (favList.includes(sura.name)) heart.classList.add("favorited");
      heart.onclick = (e) => {
        e.stopPropagation();
        toggleFav(sura.name, heart);
      };

      const name = document.createElement('div');
      name.className = 'title';
      name.textContent = sura.name;

      card.appendChild(number);
      card.appendChild(heart);
      card.appendChild(name);

      card.onclick = () => {
        document.getElementById("toggleBtn").style.display = "none";
        document.getElementById("readerSelectWrapper").style.display = "block";
        document.getElementById("readerSelectWrapper").style.display = "block";
        ayahContainer.innerHTML = '';
        sessionStorage.setItem('suraScrollY', window.scrollY);
suraContainer.scrollTop = 0;
        fetch(`https://api.alquran.cloud/v1/surah/${sura.number}`)
          .then(res => res.json())
          .then(result => {
            suraContainer.style.display = 'none';
            toggleBtn.style.display = 'none';
            title.textContent = result.data.name;
            ayahContainer.innerHTML = '';
            result.data.ayahs.forEach(ayah => {
              window.scrollTo({ top: 0, behavior: 'smooth' });
              
                const ayahDiv = document.createElement('div');
                ayahDiv.className = 'ayah';

                const textSpan = document.createElement('span');
                textSpan.className = 'ayah-text';
                textSpan.innerHTML = `﴿${ayah.numberInSurah}﴾ ${ayah.text}`;

                const iconsDiv = document.createElement('div');
                iconsDiv.style.display = "flex";
                iconsDiv.style.gap = "12px";
                iconsDiv.style.marginTop = "6px";

                const eyeIcon = document.createElement('i');
                eyeIcon.className = 'fas fa-eye eye-icon';
                eyeIcon.onclick = () => {
                  textSpan.style.visibility = textSpan.style.visibility === 'hidden' ? 'visible' : 'hidden';
                };

                const audioIcon = document.createElement('i');
                audioIcon.className = 'fas fa-volume-up audio-icon';
                audioIcon.onclick = () => {
                  const reader = getSelectedReader();
                  const ayahNumber = ayah.number;
                  fetch(`https://api.alquran.cloud/v1/ayah/${ayahNumber}/${reader}`)
                    .then(res => res.json())
                    .then(data => {
                      if (data.code === 200 && data.data.audio) {
                        const audio = new Audio(data.data.audio);
                        audio.play();
                      } else {
                        alert("عذرًا، لا يوجد تسجيل صوتي متاح لهذه الآية مع القارئ المحدد.");
                      }
                    })
                    .catch(() => {
                      alert("حدث خطأ أثناء تحميل الصوت. تأكد من اتصالك بالإنترنت أو جرّب قارئًا آخر.");
                    });
                };

                iconsDiv.appendChild(eyeIcon);
                iconsDiv.appendChild(audioIcon);
                ayahDiv.appendChild(textSpan);
                ayahDiv.appendChild(iconsDiv);
                ayahContainer.appendChild(ayahDiv);

            });
            document.getElementById("inAyahBackBtn").style.display = "block";
          });
      };

      suraContainer.appendChild(card);
    });
  }
toggleBtn.onclick = () => {
      showingFavs = !showingFavs;
      if (showingFavs) {
        const favSuras = allSuras.filter(sura => favList.includes(sura.name));
        renderSuras(favSuras);
        toggleBtn.textContent = 'العودة إلى الفهرس';
        title.textContent = 'المفضلات';
      } else {
        renderSuras(allSuras);
        toggleBtn.textContent = 'المفضلات';
        title.textContent = 'فهرس سور القرآن الكريم';
      }
    if (showingFavs) {
      const favSuras = allSuras.filter(sura => favList.includes(sura.name));
      renderSuras(favSuras);
      toggleBtn.textContent = 'العودة';
      title.textContent = 'المفضلات';
    } else {
      renderSuras(allSuras);
      toggleBtn.textContent = 'المفضلات';
      title.textContent = 'فهرس سور القرآن الكريم';
    }
  };

  fetch('https://api.alquran.cloud/v1/surah')
    .then(res => res.json())
    .then(data => {
      allSuras = data.data;
      renderSuras(allSuras);
    });

  function goBackToList() {
    document.getElementById("readerSelectWrapper").style.display = "none";
    document.getElementById("toggleBtn").style.display = "inline-block";
    document.getElementById("readerSelectWrapper").style.display = "none";
    const savedScroll = sessionStorage.getItem('suraScrollY');
if (savedScroll !== null) {
  window.scrollTo({ top: parseInt(savedScroll), behavior: 'instant' });
}
    ayahContainer.innerHTML = '';
    title.textContent = 'فهرس سور القرآن الكريم';
    suraContainer.style.display = 'grid';
    toggleBtn.style.display = 'inline-block';
    document.getElementById("inAyahBackBtn").style.display = "none";
    if (showingFavs) {
      const favSuras = allSuras.filter(sura => favList.includes(sura.name));
      renderSuras(favSuras);
    } else {
      renderSuras(allSuras);
    }
  }
</script>
