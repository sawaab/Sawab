<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مواقيت الصلاة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Amiri', serif;
            direction: rtl;
            background-color: #fdfdf5;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 850px;
            width: 95%;
            margin: 20px auto;
            padding: 30px;
            background-color: #fdfdf5;
            border-radius: 16px;
            text-align: center;
        }
        h1 {
            color: #0f5e41;
            font-size: 32px;
            margin-bottom: 20px;
        }
        #city-input {
        width: 60%;
        padding: 10px;
        font-size: 16px;
        border-radius: 10px;
        border: 2px solid #ccc;
        margin: 10px auto;
        display: block;
        transition: border-color 0.3s ease;
    }
    #city-input:focus {
        outline: none;
        border-color: #0f5e41;
    }
        button {
            background-color: #0f5e41;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            margin: 8px;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #0c4a33;
        }
        .prayer-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        .prayer-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0f5e41 0%, #158a5b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
            border: 2px solid rgba(255,255,255,0.2);
        }
        .prayer-circle:hover { transform: scale(1.08); }
        .prayer-name { font-size: 22px; color: #fff; margin-bottom: 8px; font-weight: bold; }
        .prayer-time { font-size: 20px; color: #ffffffdd; }
        #next-prayer { font-size: 24px; color: #0f5e41; margin-top: 30px; }
        #time-left { font-size: 30px; font-weight: bold; color: #333; margin-top: 5px; }
        #month-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            width: 70%;
            max-width: 650px;
            padding: 20px;
            display: none;
            z-index: 1000;
            overflow-y: auto;
            max-height: 80vh;
        }
        #month-popup table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        #month-popup th, #month-popup td {
            border: 2px solid #0f5e41;
            padding: 8px;
            text-align: center;
        }
        #month-popup th {
            background-color: #0f5e41;
            color: white;
        }
        #back-btn {
            background-color: #0f5e41;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            float: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>مواقيت الصلاة</h1>
        <input type="text" id="city-input" placeholder="أدخل اسم المدينة">
        <button id="change-city-button">تحديث المواقيت</button>
        <button id="month-button">عرض الشهر الكامل</button>
        <h3 id="next-prayer"></h3>
        <h2 id="time-left"></h2>
        <div id="prayer-times"></div>
    </div>

    <div id="month-popup">
        <div style="display:flex; justify-content:flex-end; align-items:center;">
            <span id="back-btn">رجوع</span>
        </div>
        <h2 style="text-align:center;">مواقيت الصلاة لهذا الشهر</h2>
        <div id="month-table"></div>
    </div>

    <audio id="adhan-audio" src="https://download.quranicaudio.com/qdc/adhan/maher_al_muaiqly.mp3"></audio>

    <script>
        const prayerNames = { Fajr: "الفجر", Dhuhr: "الظهر", Asr: "العصر", Maghrib: "المغرب", Isha: "العشاء", Sunrise: "الشروق" };
        let city = "Cairo";
        let prayerTimesData;

        async function getPrayerTimes(city) {
            const apiUrl = `https://api.aladhan.com/v1/timingsByCity?city=${city}&country=EG&method=5`;
            const response = await fetch(apiUrl);
            const data = await response.json();
            prayerTimesData = data.data.timings;
            displayPrayerTimes();
            updateNextPrayer();
            setInterval(updateNextPrayer, 1000);
        }

        function to12HourFormat(time) {
            const [h, m] = time.split(':').map(Number);
            const period = h < 12 ? 'ص' : 'م';
            const hour12 = ((h + 11) % 12 + 1);
            return hour12 + ':' + (m < 10 ? '0' + m : m) + ' ' + period;
        }

        function displayPrayerTimes() {
            const div = document.getElementById("prayer-times");
            div.innerHTML = "";
            let row = document.createElement("div");
            row.className = "prayer-row";
            let count = 0;
            for (const prayer in prayerTimesData) {
                if (prayerNames[prayer]) {
                    const box = document.createElement("div");
                    box.className = "prayer-circle";
                    const formatted = to12HourFormat(prayerTimesData[prayer]);
                    box.innerHTML = `<strong class="prayer-name">${prayerNames[prayer]}</strong><span class="prayer-time">${formatted}</span>`;
                    row.appendChild(box);
                    count++;
                    if (count % 2 === 0) {
                        div.appendChild(row);
                        row = document.createElement("div");
                        row.className = "prayer-row";
                    }
                }
            }
            if (count % 2 !== 0) div.appendChild(row);
        }

        function updateNextPrayer() {
            const now = new Date();
            let nextPrayer = null, nextName = "";
            const list = Object.entries(prayerTimesData)
                .filter(([p]) => prayerNames[p])
                .map(([p, time]) => {
                    const [h, m] = time.split(':').map(Number);
                    const t = new Date();
                    t.setHours(h, m, 0, 0);
                    if (t < now) t.setDate(t.getDate() + 1);
                    return { name: p, time: t };
                })
                .sort((a, b) => a.time - b.time);
            nextPrayer = list[0];
            nextName = prayerNames[nextPrayer.name];
            const diff = nextPrayer.time - now;
            document.getElementById("next-prayer").textContent = `الوقت المتبقي لـ ${nextName}:`;
            document.getElementById("time-left").textContent = formatTime(diff);
            if (diff < 1000) document.getElementById("adhan-audio").play();
        }

        function formatTime(ms) {
            const h = Math.floor(ms / 3600000);
            const m = Math.floor((ms % 3600000) / 60000);
            const s = Math.floor((ms % 60000) / 1000);
            return `${h} ساعة و ${m} دقيقة و ${s} ثانية`;
        }

        async function showMonth(city) {
            const today = new Date();
            const month = today.getMonth() + 1;
            const year = today.getFullYear();
            const url = `https://api.aladhan.com/v1/calendarByCity/${year}/${month}?city=${city}&country=EG&method=5`;
            const res = await fetch(url);
            const data = await res.json();
            let table = "<table><tr><th>التاريخ</th>";
            for (const p in prayerNames) table += `<th>${prayerNames[p]}</th>`;
            table += "</tr>";
            data.data.forEach(day => {
                table += `<tr><td>${day.date.gregorian.date}</td>`;
                for (const p in prayerNames) {
                    const time24 = day.timings[p].split(' ')[0];
                    table += `<td>${to12HourFormat(time24)}</td>`;
                }
                table += "</tr>";
            });
            table += "</table>";
            document.getElementById("month-table").innerHTML = table;
            document.getElementById("month-popup").style.display = "block";
        }

        document.getElementById("change-city-button").onclick = () => {
            city = document.getElementById("city-input").value || "Cairo";
            getPrayerTimes(city);
        document.getElementById('adhan-audio').play();
        };

        document.getElementById("month-button").onclick = () => showMonth(city);
        document.getElementById("back-btn").onclick = () => document.getElementById("month-popup").style.display = "none";

        getPrayerTimes(city);
        document.getElementById('adhan-audio').play();
        setInterval(() => showMonth(city), 24 * 60 * 60 * 1000); // تحديث تلقائي يومي
    </script>
</body>
</html>
